<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poop & Pour API - Documentation</title>
    
    <!-- Swagger UI CSS -->
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        },
                        accent: {
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <!-- Custom Swagger Overrides (minimal) -->
    <style>
        /* Dark mode overrides for Swagger UI */
        .swagger-ui { background: transparent !important; }
        .swagger-ui .topbar { display: none !important; }
        .swagger-ui .info { margin: 0 !important; padding: 0 !important; }
        .swagger-ui .info .title { display: none !important; }
        .swagger-ui .info .description { color: #94a3b8 !important; }
        .swagger-ui .info a { color: #6366f1 !important; }
        
        /* Operation blocks */
        .swagger-ui .opblock { background: #1e293b !important; border-radius: 0.5rem !important; margin-bottom: 0.75rem !important; }
        .swagger-ui .opblock .opblock-summary { border-radius: 0.5rem !important; }
        .swagger-ui .opblock.opblock-get { border-left: 4px solid #3b82f6 !important; }
        .swagger-ui .opblock.opblock-post { border-left: 4px solid #22c55e !important; }
        .swagger-ui .opblock.opblock-put { border-left: 4px solid #f59e0b !important; }
        .swagger-ui .opblock.opblock-delete { border-left: 4px solid #ef4444 !important; }
        .swagger-ui .opblock.opblock-patch { border-left: 4px solid #8b5cf6 !important; }
        
        /* Text colors */
        .swagger-ui, .swagger-ui .opblock-tag, .swagger-ui .opblock-summary-path,
        .swagger-ui .opblock-summary-description, .swagger-ui table thead tr th,
        .swagger-ui table tbody tr td, .swagger-ui .parameter__name,
        .swagger-ui .response-col_status, .swagger-ui .model-title,
        .swagger-ui section.models h4, .swagger-ui .model { color: #e2e8f0 !important; }
        
        /* Backgrounds */
        .swagger-ui .opblock-body, .swagger-ui .opblock-section-header,
        .swagger-ui section.models, .swagger-ui .model-box { background: #334155 !important; }
        .swagger-ui table thead tr th, .swagger-ui table thead tr td { background: #475569 !important; }
        
        /* Inputs */
        .swagger-ui input, .swagger-ui textarea, .swagger-ui select {
            background: #334155 !important; color: #e2e8f0 !important;
            border: 1px solid #475569 !important; border-radius: 0.375rem !important;
        }
        
        /* Buttons */
        .swagger-ui .btn.execute { background: #6366f1 !important; border: none !important; }
        .swagger-ui .btn.cancel { background: #ef4444 !important; }
        .swagger-ui .btn.authorize { background: #10b981 !important; color: white !important; }
        .swagger-ui .btn.authorize svg { fill: white !important; }
        
        /* Code blocks */
        .swagger-ui .microlight { background: #0f172a !important; border-radius: 0.5rem !important; }
        
        /* Modal */
        .swagger-ui .dialog-ux .modal-ux { background: #1e293b !important; border: 1px solid #475569 !important; }
        .swagger-ui .dialog-ux .modal-ux-header { background: #334155 !important; }
        .swagger-ui .dialog-ux .modal-ux-header h3, .swagger-ui .dialog-ux .modal-ux-content p,
        .swagger-ui .dialog-ux .modal-ux-content label { color: #e2e8f0 !important; }
        
        /* Scheme container (Authorize section) */
        .swagger-ui .scheme-container { 
            background: transparent !important; 
            box-shadow: none !important;
            border: none !important;
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen">
    <div id="app">
    
    <!-- Header -->
    <header class="bg-gradient-to-r from-primary-600 via-primary-500 to-accent-500 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo -->
                <div class="flex items-center gap-3">
                    <span class="text-3xl">🚽</span>
                    <div>
                        <h1 class="text-white font-bold text-xl">Poop & Pour API</h1>
                        <span class="text-white/70 text-xs">Documentation</span>
                    </div>
                    <span class="ml-2 px-2 py-0.5 bg-white/20 rounded-full text-white text-xs font-medium">v1.0</span>
                </div>
                
                <!-- Navigation -->
                <nav class="flex items-center gap-6">
                    <a href="/" class="text-white/90 hover:text-white text-sm font-medium transition">Home</a>
                    <a href="/swagger/v1/swagger.json" target="_blank" class="text-white/90 hover:text-white text-sm font-medium transition">OpenAPI Spec</a>
                    <button @click="copySpec" class="text-white/90 hover:text-white text-sm font-medium transition flex items-center gap-1">
                        <span>{{ copied ? '✓ Copied!' : '📋 Copy Spec' }}</span>
                    </button>
                    <button 
                        @click="quickLogin"
                        :disabled="isLoggingIn"
                        class="flex items-center gap-2 px-3 py-1.5 bg-white/20 hover:bg-white/30 text-white rounded-lg text-sm font-medium transition disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                        <span v-if="isLoggingIn">⏳</span>
                        <span v-else>⚡</span>
                        <span>{{ isLoggingIn ? 'Logging in...' : 'Quick Login' }}</span>
                    </button>
                </nav>
            </div>
        </div>
    </header>
    
    <!-- Quick Actions Bar -->
    <div class="bg-slate-800 border-b border-slate-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
            <div class="flex items-center justify-between">
                <!-- Method Filters -->
                <div class="flex items-center gap-2">
                    <button 
                        v-for="method in availableMethods" 
                        :key="method"
                        @click="toggleMethodFilter(method)"
                        :class="methodFilters.includes(method) ? methodColors[method].active : methodColors[method].inactive"
                        class="px-3 py-1 rounded-full text-xs font-semibold transition"
                    >
                        {{ method }}
                    </button>
                </div>
                
                <!-- Stats -->
                <div class="flex items-center gap-4 text-sm text-slate-400">
                    <span>📊 <span class="text-slate-200">{{ endpointCount }}</span> endpoints</span>
                    <span>📦 <span class="text-slate-200">{{ schemaCount }}</span> schemas</span>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Swagger UI Container -->
        <div id="swagger-ui" class="swagger-container"></div>
    </main>
    
    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <div class="flex items-center justify-between">
                <p class="text-slate-400 text-sm">
                    © 2026 Poop & Pour. Built with ❤️ and lots of ☕
                </p>
                <div class="flex items-center gap-4 text-sm">
                    <a href="#" class="text-slate-400 hover:text-primary-400 transition">Privacy Policy</a>
                    <a href="#" class="text-slate-400 hover:text-primary-400 transition">Terms of Service</a>
                    <a href="https://swagger.io" target="_blank" class="text-slate-400 hover:text-primary-400 transition">Powered by Swagger</a>
                </div>
            </div>
        </div>
    </footer>
    
    <!-- Toast Notifications -->
    <transition name="fade">
        <div 
            v-if="toast.show"
            class="fixed bottom-4 right-4 px-4 py-3 rounded-lg shadow-lg text-white text-sm font-medium"
            :class="toast.type === 'success' ? 'bg-green-500' : 'bg-red-500'"
        >
            {{ toast.message }}
        </div>
    </transition>
    
    </div> <!-- End of #app -->
    
    <!-- Swagger UI Scripts -->
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
    
    <!-- Vue App -->
    <script src="/swagger/swagger-app.js"></script>
    
    <!-- Transition Styles -->
    <style>
        .fade-enter-active, .fade-leave-active {
            transition: opacity 0.3s ease;
        }
        .fade-enter-from, .fade-leave-to {
            opacity: 0;
        }
    </style>
</body>
</html>
